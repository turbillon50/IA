<script>
const paths={chat:'M21 11a8 8 0 0 1-8 8H6l-4 3V11a8 8 0 0 1 8-8h3a8 8 0 0 1 8 8Z',projects:'M3 7V4h6l2 3h10v13H3V7Z M3 7h18',memory:'M6 3h12v19l-6-4-6 4V3Z',people:'M16 21v-3a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v3 M9 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M18 3a4 4 0 0 1 0 8 M19 14a4 4 0 0 1 3 4v3',plus:'M12 5v14 M5 12h14',search:'M21 21l-5-5 M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16',arrow:'M9 5l7 7-7 7',back:'M15 5l-7 7 7 7',send:'m3 3 18 9-18 9 4-9-4-9Z M7 12h14',more:'M5 12h.01 M12 12h.01 M19 12h.01',link:'M10 13a5 5 0 0 0 7 0l4-4a5 5 0 0 0-7-7l-2 2 M14 11a5 5 0 0 0-7 0l-4 4a5 5 0 0 0 7 7l2-2',check:'m4 12 5 5L20 6',checks:'m2 12 5 5L18 6 M11 17l11-11',clock:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18 M12 7v5l3 2',settings:'M4 7h16 M4 17h16 M8 4v6 M16 14v6',close:'m6 6 12 12 M18 6 6 18',file:'M14 2H5v20h14V7l-5-5Z M14 2v6h5 M8 13h8 M8 17h6',shield:'M12 2 3 6v6c0 5 9 10 9 10s9-5 9-10V6l-9-4Z M8 12l3 3 5-6',external:'M14 3h7v7 M21 3 10 14 M10 3H3v18h18v-7',moon:'M21 13A9 9 0 0 1 11 3a9 9 0 1 0 10 10Z',bell:'M18 8a6 6 0 0 0-12 0v7l-2 3h16l-2-3V8 M10 21h4',mail:'M3 5h18v14H3V5Z m0 0 9 8 9-8',copy:'M8 8h13v13H8V8Z M16 8V3H3v13h5',globe:'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20 M2 12h20 M12 2c-6 6-6 14 0 20 M12 2c6 6 6 14 0 20',refresh:'M20 7v5h-5 M4 17v-5h5 M20 12a8 8 0 0 0-14-5 M4 12a8 8 0 0 0 14 5',lock:'M5 10h14v11H5V10Z M8 10V6a4 4 0 0 1 8 0v4',logout:'M9 3H3v18h6 M13 7l5 5-5 5 M8 12h12',spark:'m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3 3-7Z',pin:'m8 3 8 0-1 6 3 3v2H6v-2l3-3-1-6Z M12 14v8'};
const ic=(n)=>`<span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="${paths[n]||paths.chat}"/></svg></span>`;
const esc=(v)=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const personData=[{id:'alix',name:'ALIX',initial:'A',color:'',kind:'IA',owner:'Luis',role:'Arquitectura y continuidad'},{id:'ariadna',name:'Ariadna',initial:'A',color:'pink',kind:'IA',owner:'Luis',role:'Investigación y fuentes'},{id:'selene',name:'Selene',initial:'S',color:'gold',kind:'IA',owner:'Acevedo',role:'Coordinación del proyecto'},{id:'luis',name:'Luis de la Torre',initial:'L',color:'blue human',kind:'Persona',owner:'',role:'Producto y dirección'},{id:'acevedo',name:'Acevedo',initial:'A',color:'gold human',kind:'Persona',owner:'',role:'Colaborador'}];
let rooms=[{id:'paradox',name:'Mesa Paradox',type:'group',preview:'Ariadna: Ya dejé las fuentes en la memoria.',time:'9:24',unread:2},{id:'alix',name:'ALIX',type:'direct',preview:'Por lo esencial: conversar y recordar.',time:'9:18',unread:0},{id:'selene',name:'Selene',type:'direct',preview:'Revisamos la agenda juntos.',time:'8:56',unread:0},{id:'ariadna',name:'Ariadna',type:'direct',preview:'Tengo una propuesta para el proyecto.',time:'8:42',unread:1},{id:'equipo',name:'Luis y equipo',type:'group',preview:'Tú: Vamos paso a paso.',time:'Ayer',unread:0}];
const memories=[{id:'m1',title:'Primero, comunicación y memoria',body:'La primera versión conectará conversaciones elegidas por cada persona. Comprobaremos un mensaje de ida y vuelta antes de ampliar el grupo.',scope:'Mesa Paradox',author:'Luis',date:'Hoy · 9:12',type:'Acuerdo'},{id:'m2',title:'Cada conversación conserva su espacio',body:'Al grupo se comparte únicamente el contenido autorizado. La memoria del proyecto reúne acuerdos y documentos compartidos.',scope:'Proyecto IAapp',author:'ALIX',date:'Hoy · 9:05',type:'Criterio'},{id:'m3',title:'Una dirección visual compartida',body:'Negro absoluto, blanco perla y lavanda. Navegación fija, tipografía legible y una sola biblioteca de componentes.',scope:'Proyecto IAapp',author:'Luis',date:'Ayer · 18:40',type:'Decisión'}];
let messages={paradox:[{author:'luis',text:'Quiero que todos podamos estar aquí, cada quien con sus IAs. Y que lo acordado se conserve.',time:'9:03'},{author:'alix',text:'Empecemos por una sala compartida. Cada persona elige qué conversaciones conecta y qué información comparte.',time:'9:05'},{author:'ariadna',text:'Propongo que la primera prueba sea concreta: un mensaje de ida y vuelta. Dejamos el resultado en la memoria del proyecto.',time:'9:08',save:true},{author:'selene',text:'De acuerdo. Yo puedo acompañar la coordinación de esa primera prueba.',time:'9:12'}],alix:[{author:'luis',text:'¿Por dónde empezamos con IAapp?',time:'9:18'},{author:'alix',text:'Por lo esencial: conversar, crear grupos y recordar lo acordado.\n\nPrimero conectamos dos chats y comprobamos que puedan responder desde su conversación de origen.',time:'9:19',save:true}],selene:[{author:'selene',text:'Aquí reuniremos la agenda y los pendientes compartidos del proyecto.',time:'8:56'}],ariadna:[{author:'ariadna',text:'Tengo las fuentes listas. Las guardamos con cada acuerdo para poder regresar a ellas.',time:'8:42'}],equipo:[{author:'luis',text:'Vamos paso a paso. Primero validamos la comunicación.',time:'Ayer'}]};
let state={page:'chats',room:'paradox',mobileRoom:false,filter:'Todos',query:'',example:'normal',tab:'Resumen',connectStep:1,connectName:'Nueva IA',memory:'m1',person:'alix',peopleFilter:'Todos'};
const defaultMembers=['luis','acevedo','alix','ariadna','selene'];
const roomMembers=r=>r.members||(r.type==='group'?defaultMembers:['luis',r.id]);
const memberSummary=r=>{const ps=roomMembers(r).map(getPerson);const humans=ps.filter(p=>p.kind==='Persona').length,ais=ps.length-humans;return `${humans} ${humans===1?'persona':'personas'} · ${ais} ${ais===1?'IA':'IAs'}`};
const getPerson=id=>personData.find(x=>x.id===id)||personData[0];
const avatar=(id,extra='')=>{let p=getPerson(id);return `<span class="avatar ${p.color} ${extra}" aria-hidden="true">${p.initial}${p.kind==='IA'?'<span class="mini-tag">IA</span>':''}</span>`};
const stack=(ids=['luis','alix','selene'])=>`<span class="stack" aria-hidden="true">${ids.slice(0,3).map(id=>avatar(id)).join('')}</span>`;
const badge=(s,cls='')=>`<span class="badge ${cls}">${cls==='good'?'<i class="dot"></i>':''}${s}</span>`;
const button=(text,action,icon,cls='secondary')=>`<button class="${cls}" data-action="${action}"${text?'':' aria-label="Ajustes"'}>${icon?ic(icon):''}${text}</button>`;
function nav(){const tabs=[['chats','Chats','chat'],['projects','Proyectos','projects'],['memory','Memoria','memory'],['people','Personas e IAs','people']];let active=state.page;if(['project'].includes(active))active='projects';if(['memory-detail'].includes(active))active='memory';if(['profile','connect'].includes(active))active='people';document.getElementById('rail').innerHTML=`<button class="brand" data-action="nav:chats" aria-label="IAapp inicio">I<span>A</span></button>${tabs.map(([id,label,icon])=>`<button class="nav ${active===id?'active':''}" data-action="nav:${id}" aria-current="${active===id?'page':'false'}">${ic(icon)}<span>${label==='Personas e IAs'?'Personas':label}</span></button>`).join('')}<button class="nav bottom" data-action="nav:settings" aria-label="Configuración">${ic('settings')}<span>Ajustes</span></button><button data-action="nav:settings" aria-label="Perfil de Luis">${avatar('luis')}</button>`;document.getElementById('mobile-tabs').innerHTML=tabs.map(([id,label,icon])=>`<button class="${active===id?'active':''}" data-action="nav:${id}">${ic(icon)}<span>${id==='people'?'Personas':label}</span></button>`).join('');const hidden=['welcome'].includes(state.page)||(state.page==='chats'&&state.mobileRoom);document.getElementById('mobile-tabs').style.display=hidden?'none':'';document.getElementById('main').classList.toggle('in-chat',hidden);}
function render(){nav();let content=({chats:chatPage,projects:projectsPage,project:projectPage,memory:memoryPage,'memory-detail':memoryDetail,people:peoplePage,profile:profilePage,connect:connectPage,settings:settingsPage,welcome:welcomePage,admin:adminPage})[state.page]||chatPage;document.getElementById('main').innerHTML=content();if(state.page==='chats'&&state.mobileRoom){let m=document.querySelector('.messages');if(m)m.scrollTop=m.scrollHeight;}document.title=`IAapp · ${state.page==='chats'?'Chats':state.page==='projects'?'Proyectos':'Diseño'}`;}
function roomList(){let filtered=rooms.filter(r=>(state.filter!=='Grupos'||r.type==='group')&&(state.filter!=='Sin leer'||r.unread>0)&&r.name.toLowerCase().includes(state.query.toLowerCase()));if(state.example==='empty'||!filtered.length)return `<div class="empty">${ic('chat')}<h2>${state.query?'Sin coincidencias':'Tu primera conversación'}</h2><p>${state.query?'Prueba con otro nombre.':'Invita a una persona o conecta una IA para comenzar.'}</p>${button('Nueva conversación','new-room','plus','primary')}</div>`;return filtered.map(r=>`<button class="room ${state.room===r.id?'selected':''}" data-action="room:${r.id}">${r.type==='group'?stack(roomMembers(r)):avatar(r.id)}<span class="room-copy"><span class="room-name">${esc(r.name)}<time>${r.time}</time></span><span class="room-preview">${esc(r.preview)}</span></span>${r.unread?`<span class="unread">${r.unread}</span>`:''}</button>`).join('');}
function chatPage(){const room=rooms.find(r=>r.id===state.room)||rooms[0],group=room.type==='group';return `<div class="shell ${state.mobileRoom?'mobile-room':''}"><aside class="sidebar"><div class="sidebar-top"><div class="eyebrow">Tu espacio compartido</div><div class="title-row"><h1>Chats</h1><button class="circle accent" data-action="new-room" aria-label="Nueva conversación">${ic('plus')}</button></div><label class="search">${ic('search')}<input id="search" placeholder="Buscar conversación" aria-label="Buscar conversación" value="${esc(state.query)}"></label><div class="chips">${['Todos','Grupos','Sin leer'].map(f=>`<button class="chip ${state.filter===f?'active':''}" data-action="filter:${f}" aria-pressed="${state.filter===f}">${f}</button>`).join('')}</div></div><div class="rooms" id="rooms">${roomList()}</div><div class="sidebar-foot"><span>Espacio privado · Por invitación</span>${ic('lock')}</div></aside><section class="chat" aria-label="Conversación ${esc(room.name)}"><header class="chat-head"><button class="circle back" data-action="back-chats" aria-label="Volver a chats">${ic('back')}</button>${group?stack(roomMembers(room)):avatar(room.id)}<div><div class="title">${esc(room.name)}</div><div class="sub">${group?memberSummary(room):'ChatGPT Work · Vinculada por '+getPerson(room.id).owner}</div></div><div class="actions"><button class="circle desktop-only" data-action="room-search" aria-label="Buscar en conversación">${ic('search')}</button><button class="circle" data-action="${group?'group-details':'profile:'+room.id}" aria-label="Ver detalles de la conversación">${ic('more')}</button></div></header>${state.example==='error'?`<div class="notice error" style="margin:14px 17px 0">La conexión necesita atención. Tus mensajes siguen guardados. <button data-action="retry" style="color:inherit;text-decoration:underline">Reintentar</button></div>`:''}<button class="context-banner" data-action="${group?'nav:memory':'origin'}">${ic(group?'memory':'external')}<span>${group?'Memoria del grupo':'Chat de origen'}</span><span class="tail">${group?(room.id==='paradox'?'3 acuerdos':'Sin acuerdos'):'Ver conversación'}</span>${ic('arrow')}</button><div class="messages" id="messages"><div class="date">HOY · VIERNES 30 DE OCTUBRE</div>${(messages[room.id]||[]).map(messageHTML).join('')}${room.id==='paradox'?`<button class="agreement-note" data-action="memory:m1">${ic('memory')}<span>Acuerdo guardado<small>Primero, comunicación y memoria.</small></span></button>`:''}${state.example==='waiting'?`<div class="notice neutral">${ic('clock')} Mensaje recibido por la conexión. Esperando respuesta.</div>`:''}</div><div class="composer-wrap"><div class="composer-hint"><span>${group?'Responden las IAs que menciones':'Conversación privada'}</span><button data-action="routing" style="font-size:10px;color:var(--accent)">${group?'Elegir quién responde':'Ver conexión'}</button></div><form id="message-form" class="composer"><button type="button" class="circle" data-action="attachment" aria-label="Adjuntar archivo">${ic('plus')}</button><textarea id="message-input" aria-label="Escribir mensaje" placeholder="${group?'Mensaje · @mencionar':'Mensaje a '+esc(room.name)}" rows="1"></textarea><button class="circle accent" type="submit" aria-label="Enviar mensaje">${ic('send')}</button></form></div></section><aside class="context-side"><div class="side-heading">PROYECTO VINCULADO</div><button class="project-mini" data-action="nav:project"><h3>IAapp</h3><span class="tiny">Personas e inteligencias, en contacto.</span><div class="progress"><i></i></div><span class="tiny">Primera etapa · Comunicación</span></button><div class="side-heading">EN ESTA MESA</div>${roomMembers(room).map(id=>{let p=getPerson(id);return `<button class="member" data-action="profile:${id}">${avatar(id)}<span style="text-align:left"><strong>${p.name}</strong><small>${p.kind==='IA'?'IA · '+p.owner:'Persona'}</small></span></button>`}).join('')}${button('Invitar a la mesa','invite','plus','link-button')}<p class="side-note">Lo que compartimos aquí forma parte del proyecto. Cada conversación de origen conserva su espacio privado.</p></aside></div>`;}
function messageHTML(m){let p=getPerson(m.author),mine=m.author==='luis';return `<article class="message ${mine?'mine':''}">${mine?'':avatar(m.author)}<div class="msg-content">${mine?'':`<div class="msg-meta"><b>${p.name}</b>${badge(p.kind)}<time>${m.time}</time></div>`}<div class="bubble">${esc(m.text).split('\n\n').map(t=>`<p>${t}</p>`).join('')}</div>${mine?`<div class="msg-footer">${m.time} · ${m.demo?'Guardado en demo':'Entregado'} ${ic(m.demo?'clock':'checks')}</div>`:''}${m.save?`<button class="save-message" data-action="save-memory">${ic('memory')} Guardar en memoria</button>`:''}</div></article>`;}

function memoryDetail(){let m=memories.find(x=>x.id===state.memory)||memories[0];return `<div class="page"><button class="backlink" data-action="nav:memory">${ic('back')} Memoria</button><div style="margin:15px 0">${badge(m.type,'purple')}</div><h1 style="max-width:690px">${esc(m.title)}</h1><p class="page-intro">Guardado por ${esc(m.author)} · ${m.date}</p><div class="split"><div class="card"><p style="font-size:17px;color:var(--text);line-height:1.85">${esc(m.body)}</p><div style="border-top:1px solid var(--line);padding-top:20px;margin-top:25px">${button('Ver conversación de origen','room:paradox','chat','secondary')}</div></div><div class="card"><h3>Contexto del acuerdo</h3><div class="detail-row"><span>Compartido en</span><span>${esc(m.scope)}</span></div><div class="detail-row"><span>Visible para</span><span>Integrantes del proyecto</span></div><div class="detail-row"><span>Versión</span><span>1 · Original</span></div>${button('Editar acuerdo','edit-memory',null,'link-button')}</div></div></div>`;}
function peoplePage(){return `<div class="page">${pageHead('Cada quien, con su propia voz','Personas e IAs',`<div style="display:flex;gap:8px">${button('','nav:settings','settings','circle')}${button('Agregar','add-person','plus','primary')}</div>`)}<p class="page-intro">Un equipo compartido. Cada IA está vinculada por una persona.</p><div class="chips" style="margin:0 0 25px">${['Todos','Personas','IAs'].map(t=>`<button class="chip ${state.peopleFilter===t?'active':''}" data-action="people-filter:${t}">${t}</button>`).join('')}</div><div class="people-grid">${personData.filter(p=>state.peopleFilter==='Todos'||(state.peopleFilter==='IAs'?p.kind==='IA':p.kind==='Persona')).map(p=>`<button class="person-card" data-action="profile:${p.id}"><div class="top">${avatar(p.id,'large')}${badge(p.kind)}</div><div><h3>${p.name}</h3><p>${p.role}</p>${badge(p.kind==='IA'?'Vinculada por '+p.owner:'Integrante','purple')}</div></button>`).join('')}</div></div>`;}
function profilePage(){const p=getPerson(state.person);return `<div class="page"><button class="backlink" data-action="nav:people">${ic('back')} Personas e IAs</button><div class="profile-hero">${avatar(p.id,'large')}<div><h1>${p.name}</h1><p>${p.role}</p><div style="margin-top:10px">${badge(p.kind==='IA'?'ChatGPT Work':'Persona','purple')}</div></div></div><div class="split"><section class="card"><h2>${p.kind==='IA'?'Su conexión':'Perfil del integrante'}</h2><div class="detail-row"><span>${p.kind==='IA'?'Vinculada por':'Nombre'}</span><span>${p.owner||p.name}</span></div><div class="detail-row"><span>Identificador en IAapp</span><span>@${p.id}</span></div><div class="detail-row"><span>Estado de ejemplo</span>${badge(p.kind==='IA'?'Vinculada':'Activo','good')}</div><div class="detail-row"><span>Participa en</span><span>Mesa Paradox · IAapp</span></div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:23px">${button('Abrir conversación','room:'+ (p.kind==='IA'?p.id:'equipo'),'chat','primary')}${p.kind==='IA'?button('Chat de origen','origin','external','secondary'):''}</div></section><aside class="card"><h2>Permisos compartidos</h2><p>Puede leer las salas a las que pertenece y responder en ellas. Los acuerdos compartidos se consultan desde la memoria.</p><div class="detail-row"><span>Respuesta en grupos</span><span>Por mención</span></div><div class="detail-row"><span>Acceso a archivos</span><span>Solo los del proyecto</span></div>${p.kind==='IA'?button('Administrar conexión','manage-connection','settings','link-button'):button('Ver proyectos','nav:projects','projects','link-button')}</aside></div></div>`;}
function connectPage(){let n=state.connectStep;return `<div class="page"><div class="connect-layout"><button class="backlink" data-action="nav:people">${ic('back')} Personas e IAs</button>${pageHead('Una conversación, una identidad','Vincular una IA')}<p class="page-intro">Elige qué conversación quieres traer a tu equipo.</p><div class="steps">${['Identidad','Vinculación','Comprobación'].map((t,i)=>`<div class="step ${n===i+1?'active':''}"><em>${i+1}</em>${t}</div>`).join('')}</div><section class="card">${n===1?`<div class="provider">${ic('spark')}<div><strong>ChatGPT Work</strong><div class="tiny">Conversaciones compatibles con Events</div></div><span class="tail">${ic('check')}</span></div><form id="connect-form"><label class="field"><span>Nombre dentro de IAapp</span><input id="ai-name" required maxlength="40" value="${state.connectName==='Nueva IA'?'':esc(state.connectName)}" placeholder="Por ejemplo, mi asistente de proyecto"><small>Este nombre identifica la conversación que vas a vincular.</small></label><label class="field"><span>¿Qué aporta al equipo?</span><input placeholder="Investigación, coordinación, diseño…" maxlength="100"></label><div class="notice neutral">Solo se compartirá lo que esta IA publique en las salas autorizadas.</div><button type="submit" class="primary">Continuar ${ic('arrow')}</button></form>`:n===2?`<h2>Conecta la conversación elegida</h2><p>En el producto final, autorizarás IAapp en ChatGPT y usarás una invitación de un solo uso para emparejar este perfil.</p><div class="connection-code" style="margin:20px 0">Vincular «${esc(state.connectName)}» a IAapp\nCódigo de ejemplo: DEMO-IAAP\nVigencia prevista: 10 minutos</div><div class="notice">Esta es una vista de diseño. El código es ilustrativo y no conecta una cuenta.</div>${button('Copiar ejemplo','copy-pair','copy','secondary')}<div style="margin-top:20px">${button('Ver comprobación de ejemplo','connect-next','arrow','primary')}</div>`:`<div style="text-align:center;padding:15px 0 5px"><div style="margin-bottom:20px">${avatar('alix','large')}</div><h2 style="font:27px Georgia,serif">El último paso: comprobar</h2><p>La conexión se mostrará como lista después de recibir una respuesta real desde el chat de origen.</p></div><div class="detail-row"><span>Perfil creado</span>${ic('check')}</div><div class="detail-row"><span>Suscripción autorizada</span>${badge('Ejemplo','purple')}</div><div class="detail-row"><span>Prueba de ida y vuelta</span>${badge('Pendiente','warn')}</div><div class="notice neutral" style="margin-top:20px">Esta maqueta no ejecuta la conexión. En producción, aquí verás el resultado comprobado.</div>${button('Volver a mis IAs','nav:people','people','primary')}`}</section></div></div>`;}

function showNewRoom(){modal(`<h2>Nueva conversación</h2><p>Una persona, una IA o una mesa compartida.</p><form id="new-room-form"><label class="field"><span>Nombre del grupo</span><input id="room-name" required maxlength="60" placeholder="Por ejemplo, Mesa de diseño"></label><div class="eyebrow" style="margin-bottom:12px">Invitar a esta conversación</div>${personData.filter(p=>p.id!=='luis').map(p=>`<label class="check-row">${avatar(p.id)}<span>${p.name}<small class="tiny" style="display:block">${p.kind==='IA'?'IA de '+p.owner:'Persona'}</small></span><input type="checkbox" name="members" value="${p.id}" ${p.id==='alix'?'checked':''}></label>`).join('')}<p class="tiny" style="margin-top:16px">Las IAs responderán cuando las menciones.</p><div class="footer"><button type="submit" class="primary">Crear grupo</button></div></form>`);}
function invite(){modal(`<h2>Invitar a una persona</h2><p>Comparte el proyecto con alguien de confianza.</p><form id="invite-form"><label class="field"><span>Correo electrónico</span><input type="email" required placeholder="nombre@correo.com"></label><label class="field"><span>Rol en el espacio</span><select><option>Miembro</option><option>Administrador</option></select></label><div class="notice neutral">En esta vista no se envían invitaciones reales.</div><div class="footer"><button type="submit" class="primary">Preparar invitación</button></div></form>`);}
document.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(!target)return;const action=target.dataset.action;const [a,...rest]=action.split(':');const v=rest.join(':');if(a==='nav'){state.page=v;state.mobileRoom=false;if(v==='connect')state.connectStep=1;if(v==='project'){state.projectName='IAapp';state.tab='Resumen';}render();}else if(a==='room'){state.page='chats';state.room=v;state.mobileRoom=true;state.example='normal';document.getElementById('view-state').value='normal';render();}else if(a==='back-chats'){state.mobileRoom=false;render();}else if(a==='filter'){state.filter=v;render();}else if(a==='tab'){state.tab=v;render();}else if(a==='profile'){state.page='profile';state.person=v;render();}else if(a==='memory'){state.page='memory-detail';state.memory=v;render();}else if(a==='memory-filter'){state.memoryFilter=v;render();}else if(a==='people-filter'){state.peopleFilter=v;render();}else if(a==='project'){state.page='project';state.projectName=v==='paradox'?'Paradox':'IAapp';state.tab='Resumen';render();}else if(a==='new-room'){showNewRoom();}else if(a==='close-modal'){document.getElementById('modal').close();}else if(a==='invite'){invite();}else if(a==='add-person'){modal(`<h2>Ampliar la mesa</h2><p>Elige a quién quieres agregar.</p><div style="display:grid;gap:12px">${button('Invitar a una persona','invite','people','secondary')}${button('Vincular una IA','close-and-connect','link','primary')}</div>`);}else if(a==='close-and-connect'){document.getElementById('modal').close();state.page='connect';state.connectStep=1;render();}else if(a==='connect-next'){state.connectStep=Math.min(state.connectStep+1,3);render();}else if(a==='copy-pair'){if(navigator.clipboard)navigator.clipboard.writeText('EJEMPLO DE DISEÑO: vincular '+state.connectName+' a IAapp. Código DEMO-IAAP; no válido para conectar.').then(()=>toast('Ejemplo copiado. No es un código de conexión real.')).catch(()=>toast('El código de ejemplo es DEMO-IAAP.'));else toast('Código de ejemplo: DEMO-IAAP.');}else if(a==='origin'){modal(`<h2>Conversación de origen</h2><p>En producción, este botón abrirá el enlace que su propietario asocie al perfil.</p><div class="notice neutral">Los perfiles de esta maqueta son ejemplos. No incluyen enlaces a chats privados.</div>${button('Entendido','close-modal',null,'primary')}`);}else if(a==='group-details'||a==='routing'){modal(`<h2>La mesa compartida</h2><p>${memberSummary(rooms.find(r=>r.id===state.room)||rooms[0])} · Respuesta por mención</p>${roomMembers(rooms.find(r=>r.id===state.room)||rooms[0]).map(id=>`<div class="member">${avatar(id)}<span><strong>${getPerson(id).name}</strong><small>${getPerson(id).role}</small></span></div>`).join('')}<div class="notice neutral">Una IA responde cuando recibe una mención o un turno asignado. Cada integrante puede consultar la memoria de esta sala.</div>${button('Invitar a alguien','invite','plus','primary')}`);}else if(a==='save-memory'||a==='edit-memory'){let m=memories.find(x=>x.id===state.memory);modal(`<h2>${a==='edit-memory'?'Editar acuerdo':'Guardar en memoria'}</h2><p>Conserva una decisión con su contexto.</p><form id="memory-form" data-edit="${a==='edit-memory'?m.id:''}"><label class="field"><span>Título</span><input id="memory-title" required maxlength="120" value="${a==='edit-memory'?esc(m.title):''}" placeholder="¿Qué decidimos?"></label><label class="field"><span>Acuerdo</span><textarea id="memory-body" required>${a==='edit-memory'?esc(m.body):'Primero comprobaremos un mensaje de ida y vuelta.'}</textarea></label><label class="field"><span>Compartir en</span><select><option>Mesa Paradox</option><option>Proyecto IAapp</option></select></label><div class="footer"><button type="submit" class="primary">Guardar acuerdo</button></div></form>`);}else if(a==='new-project'){modal(`<h2>Nuevo proyecto</h2><p>Dale un lugar a lo que van a construir.</p><form id="project-form"><label class="field"><span>Nombre</span><input id="project-name" required maxlength="60" placeholder="Nombre del proyecto"></label><label class="field"><span>Objetivo</span><textarea required placeholder="¿Qué quieren conseguir juntos?"></textarea></label><div class="footer"><button type="submit" class="primary">Crear proyecto</button></div></form>`);}else if(a==='attachment'){modal(`<h2>Compartir un archivo</h2><p>Selecciona un archivo para ver cómo se presentaría en la conversación.</p><label class="field"><span>Archivo de ejemplo</span><input type="file" id="demo-file"></label><p class="tiny">La maqueta solo muestra el nombre. El archivo no se sube.</p>`);}else if(a==='file-preview'){modal(`<h2>Dirección del proyecto</h2><p>Vista de un documento compartido.</p><div class="card"><p>Primera etapa: comunicación básica, dos personas y sus IAs, una sala y memoria de acuerdos.</p></div>`);}else if(a==='room-search'){modal(`<h2>Buscar en la conversación</h2><label class="field"><span>Texto</span><input id="room-search" placeholder="Buscar un mensaje"></label><div id="room-search-results"></div>`);}else if(a==='theme'){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light';render();}else if(a==='toggle'){target.setAttribute('aria-checked',target.getAttribute('aria-checked')!=='true');}else if(a==='retry'){state.example='waiting';document.getElementById('view-state').value='waiting';render();toast('Estado de ejemplo: esperando confirmación.');}else if(a==='manage-connection'){modal(`<h2>Administrar conexión</h2><p>Ejemplo del control que tendrá el propietario.</p><div class="detail-row"><span>Recibir mensajes del grupo</span><button class="switch" role="switch" aria-label="Recibir mensajes del grupo" aria-checked="true" data-action="toggle"></button></div><div class="notice neutral" style="margin-top:20px">Al pausar, se conservarán el perfil y los mensajes. Podrás volver a vincular la conversación.</div>${button('Ver flujo de vinculación','close-and-connect','link','primary')}`);}});
document.addEventListener('input',e=>{if(e.target.id==='search'){state.query=e.target.value;document.getElementById('rooms').innerHTML=roomList();}if(e.target.id==='room-search'){const q=e.target.value.toLowerCase();const results=(messages[state.room]||[]).filter(m=>m.text.toLowerCase().includes(q));document.getElementById('room-search-results').innerHTML=results.map(m=>`<div class="card" style="margin-top:10px"><strong>${getPerson(m.author).name}</strong><p>${esc(m.text)}</p></div>`).join('')||'<p>Sin coincidencias.</p>';}});
document.addEventListener('change',e=>{if(e.target.id==='view-state'){state.example=e.target.value;render();}if(e.target.matches('.task input'))e.target.closest('.task').classList.toggle('done',e.target.checked);if(e.target.id==='demo-file'&&e.target.files[0]){toast('Archivo seleccionado: '+e.target.files[0].name+' · Sin subir');document.getElementById('modal').close();}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(f.id==='message-form'){const input=document.getElementById('message-input');let text=input.value.trim();if(!text)return;(messages[state.room]??=[]).push({author:'luis',text,time:'Ahora',demo:true});render();let el=document.querySelector('.messages');el.scrollTop=el.scrollHeight;document.getElementById('message-input').focus();}if(f.id==='new-room-form'){let name=document.getElementById('room-name').value.trim();if(!name)return;const members=Array.from(f.querySelectorAll('input[name=members]:checked'),x=>x.value);if(!members.length){toast('Selecciona al menos una persona o IA.');return;}let id='room-'+Date.now();rooms.unshift({id,name,type:'group',members:['luis',...members],preview:'El grupo está listo para comenzar.',time:'Ahora',unread:0});messages[id]=[];document.getElementById('modal').close();state.page='chats';state.room=id;state.mobileRoom=true;render();toast('Grupo creado en la maqueta.');}if(f.id==='invite-form'){document.getElementById('modal').close();toast('Invitación preparada como ejemplo. No se envió correo.');}if(f.id==='connect-form'){state.connectName=document.getElementById('ai-name').value.trim();if(!state.connectName)return;state.connectStep=2;render();}if(f.id==='memory-form'){let title=document.getElementById('memory-title').value.trim(),body=document.getElementById('memory-body').value.trim();if(!title||!body)return;if(f.dataset.edit){let m=memories.find(m=>m.id===f.dataset.edit);m.title=title;m.body=body;}else memories.unshift({id:'m'+Date.now(),title,body,scope:f.querySelector('select').value,author:'Luis',date:'Ahora',type:'Acuerdo'});document.getElementById('modal').close();state.page='memory';render();toast('Acuerdo guardado en esta sesión de diseño.');}if(f.id==='project-form'){state.projectName=document.getElementById('project-name').value.trim();document.getElementById('modal').close();state.page='project';state.tab='Resumen';render();toast('Proyecto creado en la maqueta.');}if(f.id==='welcome-form'){state.page='chats';state.mobileRoom=false;render();toast('Entraste a la vista de diseño. No se creó una cuenta.');}});
document.addEventListener('keydown',e=>{if(e.target.id==='message-input'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('message-form').requestSubmit();}});
const params=new URLSearchParams(location.search);if(params.has('screen'))state.page=params.get('screen');if(params.has('room')){state.page='chats';state.room=params.get('room');state.mobileRoom=true;}if(params.get('state')){state.example=params.get('state');document.getElementById('view-state').value=state.example;}render();
</script></body></html>
